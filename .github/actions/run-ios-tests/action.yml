name: "Run iOS test suite"
description: >
  Runs one or more XCTest selectors against prebuilt products, preserves the
  xcresult on failure, detects retry-masked flakes, and uploads the suite's
  reporting artifacts.

inputs:
  scheme:
    description: Xcode scheme containing the requested tests.
    required: true
  test-selectors:
    description: Comma-separated -only-testing selectors (target, class, or method).
    required: true
  test-name:
    description: Human-readable suite name used in logs and reports.
    required: true
  artifact-name:
    description: Artifact and xcresult base name.
    required: true
  destination:
    description: xcodebuild destination specifier.
    required: false
    default: "platform=iOS Simulator,name=iPhone Air,OS=latest"
  enable-code-coverage:
    description: Pass -enableCodeCoverage YES when true.
    required: false
    default: "false"
  flaky-json:
    description: Output path for retry-masked flake metadata.
    required: true
  retention-days:
    description: Retention period for the xcresult artifact.
    required: false
    default: "1"
  slow-json:
    description: Optional output path for slow-test metadata.
    required: false
    default: ""
  slow-threshold:
    description: Slow-test threshold in seconds; required when slow-json is set.
    required: false
    default: ""
  duration-suite:
    description: Optional stable suite identifier for duration-ratchet metadata.
    required: false
    default: ""
  timeout-minutes:
    description: Hard wall-clock timeout enforced by the test runner.
    required: true

runs:
  using: composite
  steps:
    - name: Run tests
      id: tests
      continue-on-error: true
      shell: bash
      env:
        SCHEME: ${{ inputs.scheme }}
        TEST_SELECTORS: ${{ inputs.test-selectors }}
        TEST_NAME: ${{ inputs.test-name }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        DESTINATION: ${{ inputs.destination }}
        ENABLE_CODE_COVERAGE: ${{ inputs.enable-code-coverage }}
        DURATION_SUITE: ${{ inputs.duration-suite }}
        TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
      run: >-
        python3 scripts/run-ios-test-suite.py
        --scheme "$SCHEME"
        --test-selectors "$TEST_SELECTORS"
        --test-name "$TEST_NAME"
        --artifact-name "$ARTIFACT_NAME"
        --destination "$DESTINATION"
        --timeout-minutes "$TIMEOUT_MINUTES"
        --enable-code-coverage "$ENABLE_CODE_COVERAGE"
        --duration-suite "$DURATION_SUITE"

    - name: Extract and display test failures
      if: always() && steps.tests.outcome == 'failure'
      shell: bash
      env:
        RESULT_BUNDLE: test-results/${{ inputs.artifact-name }}.xcresult
        TEST_NAME: ${{ inputs.test-name }}
      run: python3 scripts/extract-test-failures.py

    - name: Detect flaky tests
      if: steps.tests.outcome == 'success'
      shell: bash
      env:
        RESULT_BUNDLE: test-results/${{ inputs.artifact-name }}.xcresult
        TEST_NAME: ${{ inputs.test-name }}
        FLAKY_JSON: ${{ inputs.flaky-json }}
      run: python3 scripts/detect-flaky-tests.py

    - name: Upload flaky test report
      if: steps.tests.outcome == 'success'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: flaky-${{ inputs.artifact-name }}
        path: ${{ inputs.flaky-json }}
        if-no-files-found: ignore

    - name: Detect slow tests
      if: steps.tests.outcome == 'success' && inputs.slow-json != ''
      shell: bash
      env:
        RESULT_BUNDLE: test-results/${{ inputs.artifact-name }}.xcresult
        TEST_NAME: ${{ inputs.test-name }}
        SLOW_JSON: ${{ inputs.slow-json }}
        SLOW_THRESHOLD: ${{ inputs.slow-threshold }}
      run: python3 scripts/detect-slow-tests.py

    - name: Upload slow test report
      if: steps.tests.outcome == 'success' && inputs.slow-json != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: slow-${{ inputs.artifact-name }}
        path: ${{ inputs.slow-json }}
        if-no-files-found: ignore

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: test-results/${{ inputs.artifact-name }}.xcresult
        if-no-files-found: warn
        retention-days: ${{ inputs.retention-days }}

    - name: Upload suite duration
      if: always() && inputs.duration-suite != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: suite-duration-${{ inputs.duration-suite }}
        path: suite-duration-${{ inputs.duration-suite }}.json
        if-no-files-found: ignore
        retention-days: 30

    - name: Propagate test failure
      if: always() && steps.tests.outcome == 'failure'
      shell: bash
      run: exit 1
