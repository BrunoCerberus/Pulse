name: "Set up iOS build environment"
description: >
  Shared setup for the macOS jobs: selects Xcode 27.0, optionally installs the
  iOS simulator runtime (idempotently), restores the Homebrew + SPM caches,
  installs XcodeGen, and generates the Xcode project. Centralizes the chain
  that was previously copy-pasted across ci.yml (build/release-build/tests),
  scheduled-tests.yml, codeql.yml and docs.yml. (release.yml keeps its own
  inlined chain — it interleaves a Firebase-config provisioning step before
  `make generate` that doesn't fit this action.) Assumes the caller has already
  run actions/checkout.

inputs:
  install-runtime:
    description: >
      Install the iOS simulator runtime. Set "false" for jobs that only build
      against a generic destination (CodeQL, DocC, Release archive) and never
      boot a simulator.
    required: false
    default: "true"
  generate-project:
    description: >
      Restore the Homebrew/SPM caches, install XcodeGen and run `make generate`.
      Set "false" for jobs that need a selected Xcode purely for its command-line
      tools (xccov, xcresulttool) and never build — they have no .xcodeproj to
      generate, so the whole chain is dead weight.
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Select Xcode 27.0
      shell: bash
      run: |
        XCODE_PATH=$(ls -d /Applications/Xcode_27.0*.app 2>/dev/null | head -1)
        if [ -z "$XCODE_PATH" ]; then
          echo "::error::Xcode 27.0 not found on runner"
          ls -d /Applications/Xcode_27*.app || true
          exit 1
        fi
        sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
        echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"
        xcodebuild -version

    # Idempotent: macOS runner images sometimes already ship a usable iOS
    # runtime. Probe first and only download when absent — `-downloadPlatform`
    # is the single largest wall-clock cost when it runs, but removing it
    # outright previously broke the simulator (commit b01707c), so we keep it
    # as the fallback rather than dropping it.
    - name: Install iOS Simulator Runtime
      if: ${{ inputs.install-runtime == 'true' }}
      shell: bash
      run: |
        # Skip only when an AVAILABLE iOS runtime already exists (a line like
        # "iOS 18.0 (...) - com.apple.CoreSimulator.SimRuntime.iOS-18-0" that is
        # not flagged unavailable). Conservative on purpose: anything short of a
        # confirmed-available runtime falls through to the download, preserving
        # the failure-safety that the unconditional download previously gave.
        if xcrun simctl list runtimes 2>/dev/null | grep -E '^iOS [0-9]' | grep -qiv 'unavailable'; then
          echo "An available iOS simulator runtime is already installed — skipping download."
          xcrun simctl list runtimes | grep -E '^iOS [0-9]' || true
          # Surface an SDK/runtime mismatch (e.g. iOS 27 SDK on an iOS 26-only
          # image) instead of silently testing on the older simulator.
          SDK_VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)
          echo "Selected iphonesimulator SDK: $SDK_VERSION"
          if ! xcrun simctl list runtimes | grep -E "^iOS ${SDK_VERSION%%.*}\." | grep -qiv 'unavailable'; then
            echo "::warning::No available iOS ${SDK_VERSION%%.*}.x simulator runtime; tests will run on an older iOS than the selected SDK."
          fi
        else
          echo "No available iOS simulator runtime found — downloading..."
          # Initialize CoreSimulator service before downloading
          xcrun simctl list runtimes > /dev/null 2>&1 || true
          sleep 5
          xcodebuild -downloadPlatform iOS
          echo "Available iOS simulator runtimes:"
          xcrun simctl list runtimes | grep -E '^iOS [0-9]'
        fi

    # Cache Homebrew's download cache only. The old /usr/local/Homebrew entry
    # was a no-op on the arm64 macos runners (brew lives in /opt/homebrew) —
    # key bumped to v2 so stale archives with the dead path aren't restored.
    - name: Cache Homebrew packages
      if: ${{ inputs.generate-project == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/Caches/Homebrew
        key: ${{ runner.os }}-brew-v2

    # Keyed on the git-tracked Package.resolved so the cache auto-invalidates
    # when a dependency changes; the vN prefix only changes when the cached
    # paths do. Only the SwiftPM download cache is stored, never the project's
    # swiftpm/ folder:
    # that folder holds the tracked Package.resolved itself, and restoring it
    # overwrote the checkout with whatever copy was cached (CI built a months-old
    # set of pins for every PR). v2 drops every entry saved with that folder.
    # The restore-keys fallback is safe because the download cache holds no pins.
    - name: Cache SPM dependencies
      if: ${{ inputs.generate-project == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/Caches/org.swift.swiftpm
        key: ${{ runner.os }}-spm-v2-${{ hashFiles('Pulse.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-v2-

    - name: Install pinned XcodeGen
      if: ${{ inputs.generate-project == 'true' }}
      uses: ./.github/actions/setup-swift-tools
      with:
        tools: XcodeGen

    - name: Generate Xcode project
      if: ${{ inputs.generate-project == 'true' }}
      shell: bash
      run: make generate

    # The committed Package.resolved is the dependency pin set; nothing in this
    # chain may rewrite it. Fail fast if a cache restore or generate step ever
    # replaces it again, instead of silently building different versions.
    - name: Verify Package.resolved matches the checkout
      if: ${{ inputs.generate-project == 'true' }}
      shell: bash
      run: |
        resolved=Pulse.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
        if ! git diff --quiet -- "$resolved"; then
          echo "::error file=$resolved::Package.resolved no longer matches the committed file after setup"
          git diff -- "$resolved"
          exit 1
        fi
