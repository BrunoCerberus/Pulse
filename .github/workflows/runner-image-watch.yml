name: Runner Image Watch

# .github/actions/setup-ios hard-fails when /Applications/Xcode_26.5*.app is
# absent:
#
#     echo "::error::Xcode 26.5 not found on runner"; exit 1
#
# That is the right behaviour — silently building on a different Xcode is worse
# than stopping — but it means a GitHub runner-image rotation takes out every
# macOS job at once, with no warning, usually mid-PR. The blast radius spans
# ci.yml, codeql.yml, docs.yml, release.yml and scheduled-tests.yml.
#
# This job boots one macos-26 runner a week purely to inventory the installed
# Xcodes. It warns (and opens a tracking issue) when the pinned 26.5 disappears,
# and notes when a newer Xcode shows up so the bump is a scheduled decision
# rather than an emergency.

on:
  schedule:
    # Tuesdays 06:00 UTC — GitHub typically rolls runner images early in the
    # week, so this lands shortly after, ahead of the working week.
    - cron: '0 6 * * 2'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

env:
  # Keep in sync with the glob in .github/actions/setup-ios/action.yml.
  PINNED_XCODE: "26.5"

jobs:
  inspect:
    name: Inspect runner image
    runs-on: macos-26
    timeout-minutes: 15

    permissions:
      contents: read
      issues: write

    steps:
    - name: Inventory installed Xcode versions
      id: inventory
      run: |
        set -uo pipefail

        echo "Installed Xcode versions on this image:"
        ls -d /Applications/Xcode*.app 2>/dev/null || echo "  (none found)"
        echo ""

        if ls -d "/Applications/Xcode_${PINNED_XCODE}"*.app >/dev/null 2>&1; then
          echo "pinned_present=true" >> "$GITHUB_OUTPUT"
          echo "Pinned Xcode ${PINNED_XCODE} is present."
        else
          echo "pinned_present=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Pinned Xcode ${PINNED_XCODE} is NOT on the macos-26 image."
        fi

        # Highest installed version, from the directory names (Xcode_26.5.1.app
        # -> 26.5.1). `sort -V` orders them semantically.
        NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null \
          | sed -E 's|.*/Xcode_([0-9.]+)\.app|\1|' \
          | sort -V | tail -1)
        NEWEST="${NEWEST:-unknown}"
        echo "newest=$NEWEST" >> "$GITHUB_OUTPUT"
        echo "Newest installed Xcode: $NEWEST"

        # String inequality is enough here: any newest != pinned is worth a look,
        # whether it is an upgrade or an unexpected downgrade.
        if [ "$NEWEST" != "$PINNED_XCODE" ] && [ "$NEWEST" != "unknown" ]; then
          echo "newer_available=true" >> "$GITHUB_OUTPUT"
        else
          echo "newer_available=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Report to job summary
      env:
        PRESENT: ${{ steps.inventory.outputs.pinned_present }}
        NEWEST: ${{ steps.inventory.outputs.newest }}
      run: |
        {
          echo "## Runner Image Watch"
          echo ""
          echo "| Field | Value |"
          echo "|-------|-------|"
          echo "| Pinned Xcode | ${PINNED_XCODE} |"
          echo "| Pinned version present | ${PRESENT} |"
          echo "| Newest on image | ${NEWEST} |"
        } >> "$GITHUB_STEP_SUMMARY"

    # Only the pinned version disappearing is an emergency — that is the case
    # that breaks every macOS job. A merely-newer Xcode is reported above and
    # left alone.
    - name: Open tracking issue if the pinned Xcode is gone
      if: steps.inventory.outputs.pinned_present == 'false'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        NEWEST: ${{ steps.inventory.outputs.newest }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail

        ISSUE_TITLE="Pinned Xcode ${PINNED_XCODE} is gone from the macos-26 image"
        ISSUE_LABEL="runner-drift"

        BODY=$(cat <<EOF
        The weekly runner-image check could not find \`/Applications/Xcode_${PINNED_XCODE}*.app\`
        on the \`macos-26\` runner. Every macOS job fails at the "Select Xcode" step
        until the pin is updated.

        - Newest Xcode on the image: **${NEWEST}**
        - Check run: ${RUN_URL}

        To fix, update the pin in both places:
        - \`.github/actions/setup-ios/action.yml\` (the \`Xcode_${PINNED_XCODE}*\` glob)
        - \`.github/workflows/runner-image-watch.yml\` (\`PINNED_XCODE\`)

        ---
        _Auto-managed by the runner-image-watch workflow; updated, not duplicated, on each red run._
        EOF
        )

        gh label create "$ISSUE_LABEL" \
          --description "Runner image drifted away from the pinned toolchain" \
          --color D93F0B 2>/dev/null || true

        EXISTING=$(gh issue list \
          --state open \
          --label "$ISSUE_LABEL" \
          --search "in:title \"$ISSUE_TITLE\"" \
          --json number,title \
          --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number // empty")

        if [ -n "$EXISTING" ]; then
          echo "Updating existing tracking issue #$EXISTING"
          gh issue comment "$EXISTING" --body "$BODY"
        else
          echo "Creating new tracking issue"
          gh issue create --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --body "$BODY"
        fi
