name: DocC

# Builds the DocC bundle so broken doc references / malformed symbol links fail
# CI instead of silently rotting. Build-only — the .doccarchive is uploaded as
# an artifact; publishing to GitHub Pages is intentionally NOT wired up (that
# would need a repo settings change).

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  changes:
    uses: ./.github/workflows/reusable-analysis-changes.yml
    permissions:
      contents: read
    with:
      kind: docs

  docc:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Build DocC execution
    runs-on: macos-26
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Shared setup (Select Xcode + brew/SPM caches + xcodegen + generate).
    # install-runtime: false — docbuild targets a generic iOS destination and
    # never boots a simulator.
    - name: Set up iOS build environment
      uses: ./.github/actions/setup-ios
      with:
        install-runtime: "false"

    - name: Resolve Package Dependencies
      run: |
        xcodebuild -resolvePackageDependencies \
          -project Pulse.xcodeproj \
          -scheme PulseDev \
          -onlyUsePackageVersionsFromResolvedFile

    # Pulse alone sets --warnings-as-errors in project.yml; dependency
    # documentation is outside our control and retains its own settings.
    - name: Build DocC documentation
      run: |
        xcodebuild docbuild \
          -project Pulse.xcodeproj \
          -scheme PulseDev \
          -destination 'generic/platform=iOS' \
          -derivedDataPath ./DerivedData \
          -onlyUsePackageVersionsFromResolvedFile \
          DOCC_EXTRACT_SWIFT_INFO_FOR_OBJC_SYMBOLS=NO \
          CODE_SIGNING_ALLOWED=NO \
          -skipMacroValidation

    - name: Locate and zip doccarchive
      id: docc
      run: |
        ARCHIVE=./DerivedData/Build/Products/Debug-iphoneos/Pulse.doccarchive
        if [ ! -d "$ARCHIVE" ]; then
          # Dependency archives do not prove Pulse documentation was built.
          echo "::error::No .doccarchive produced"
          exit 1
        fi
        echo "Built $ARCHIVE"
        # DocC writes symbol JSON with ':' in the filenames (e.g.
        # method(param:).json), which actions/upload-artifact rejects as an
        # invalid path. Zip first so the artifact is a single valid-named file.
        ditto -c -k --sequesterRsrc --keepParent "$ARCHIVE" pulse-doccarchive.zip
        echo "zip=pulse-doccarchive.zip" >> "$GITHUB_OUTPUT"

    - name: Upload doccarchive
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: steps.docc.outputs.zip != ''
      with:
        name: pulse-doccarchive
        path: ${{ steps.docc.outputs.zip }}
        if-no-files-found: ignore
        retention-days: 7

  result:
    name: Build DocC
    runs-on: ubuntu-latest
    needs: [changes, docc]
    if: always()
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Verify planned analysis completed
        env:
          DETECTION: ${{ needs.changes.result }}
          PLANNED: ${{ needs.changes.outputs.run }}
          RESULT: ${{ needs.docc.result }}
        run: |
          if [ "$DETECTION" = success ] && { { [ "$PLANNED" = true ] && [ "$RESULT" = success ]; } || { [ "$PLANNED" = false ] && [ "$RESULT" = skipped ]; }; }; then
            echo "Build DocC: $RESULT (planned: $PLANNED)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Build DocC did not complete as planned: detection=$DETECTION planned=$PLANNED result=$RESULT"
            exit 1
          fi
