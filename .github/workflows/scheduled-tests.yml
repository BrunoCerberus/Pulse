name: Scheduled Tests

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering
    inputs:
      rebaseline:
        description: >-
          Re-anchor the duration baseline — run on master while the tests
          pass. Skips the ratchet comparison so the run stays green; its
          suite-duration uploads then become the next baseline. Use after a
          legitimate permanent slowdown (new slow suite, runner change) has
          left the nightly red.
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Deny all permissions by default — each job grants only what it needs
permissions: {}

# Skip Homebrew's auto-update before every `brew install`. Auto-update
# re-evaluates all installed formulae, and any still using the deprecated
# `no_autobump! :requires_manual_review` API emit a warning that GitHub
# Actions promotes to an annotation — flooding each run with dozens of
# identical deprecation warnings. Disabling it removes that phase (and
# speeds installs); the pinned CLI tools are already on the runner image.
env:
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  build:
    name: Nightly Build
    runs-on: macos-26
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up iOS build environment
      uses: ./.github/actions/setup-ios
      with:
        install-runtime: "true"

    - name: Debug Package Dependencies
      run: |
        echo "Checking package dependencies..."
        if [ -d "Pulse.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/" ]; then
          ls -la Pulse.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/
          echo "Package.resolved content:"
          cat Pulse.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved || echo "Package.resolved not found"
        else
          echo "Swift PM directory not found (this is normal for a fresh project generation)"
        fi

    - name: Resolve Package Dependencies
      run: |
        echo "Explicitly resolving Swift Package Manager dependencies..."
        xcodebuild -resolvePackageDependencies \
          -project Pulse.xcodeproj \
          -scheme PulseDev \
          -onlyUsePackageVersionsFromResolvedFile
        echo "Package dependencies resolved successfully"

    # Each build leg records its wall clock for the CI Duration Ratchet job
    # below: the build is the single largest cost in the nightly, so it gets
    # ratcheted too. The `run:` shell is `set -e`, so a failed or timed-out
    # build exits the step before the duration is written — only successful
    # builds measure (the ratchet wants green-run drift; a failed leg is a
    # missing leg, and the red build is visible in the run anyway).
    - name: Build for testing (PulseDev)
      run: |
        echo "Building PulseDev scheme for testing..."
        START_TS=$(date +%s)
        xcodebuild build-for-testing \
          -project Pulse.xcodeproj \
          -scheme PulseDev \
          -destination 'platform=iOS Simulator,name=iPhone Air,OS=latest' \
          -derivedDataPath ./DerivedData \
          -skipMacroValidation
        SECS=$(( $(date +%s) - START_TS ))
        printf '{"suite":"build-PulseDev","seconds":%s}\n' "$SECS" > duration-build-PulseDev.json
        echo "PulseDev build took $(( SECS / 60 ))m$(( SECS % 60 ))s"

    - name: Build for testing (PulseSnapshotTests)
      run: |
        echo "Building PulseSnapshotTests scheme for testing..."
        START_TS=$(date +%s)
        xcodebuild build-for-testing \
          -project Pulse.xcodeproj \
          -scheme PulseSnapshotTests \
          -destination 'platform=iOS Simulator,name=iPhone Air,OS=latest' \
          -derivedDataPath ./DerivedData \
          -skipMacroValidation
        SECS=$(( $(date +%s) - START_TS ))
        printf '{"suite":"build-PulseSnapshotTests","seconds":%s}\n' "$SECS" > duration-build-PulseSnapshotTests.json
        echo "PulseSnapshotTests build took $(( SECS / 60 ))m$(( SECS % 60 ))s"

    # Only Build/Products is uploaded — that's all test-without-building needs
    # (the .xctestrun files and app/test bundles live there); the rest of
    # DerivedData is dead weight for the download. Mirrors ci.yml.
    - name: Upload build artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: scheduled-build-products
        path: ./DerivedData/Build/Products
        retention-days: 1

    # `always()` so a SLOW-but-green build still seeds the baseline; a failed
    # build simply leaves no file and the ratchet skips it.
    - name: Upload build duration (PulseDev)
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: suite-duration-build-PulseDev
        path: duration-build-PulseDev.json
        if-no-files-found: ignore
        retention-days: 30

    - name: Upload build duration (PulseSnapshotTests)
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: suite-duration-build-PulseSnapshotTests
        path: duration-build-PulseSnapshotTests.json
        if-no-files-found: ignore
        retention-days: 30

  # Dead-code detection. NIGHTLY-ONLY BY NECESSITY: SwiftLint's analyzer rules
  # need a full compiler log and re-run SourceKit over every invocation in it,
  # which takes longer than the entire PR lint job — far too slow to gate a PR
  # on. Self-contained (its own build) rather than reusing the Nightly Build
  # artifacts because `unused_declaration` needs the DerivedData module outputs
  # that the log's compile commands reference, not just the log.
  #
  # ADVISORY, NEVER BLOCKING — the same posture rule 38 takes for flaky tests.
  # `unused_declaration` cannot see references originating outside the linted
  # sources, so it reports genuine dead code (an unreferenced `SettingsCoordinator`)
  # alongside unavoidable false positives (`var window: UIWindow?`, which UIKit
  # assigns via UIWindowSceneDelegate). A gate on that mix would train people to
  # ignore it. `notify-failure` keys off `test-results` only, so nothing here
  # opens an issue.
  dead-code:
    name: Nightly Dead Code
    runs-on: macos-26
    timeout-minutes: 90

    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up iOS build environment
      uses: ./.github/actions/setup-ios
      with:
        install-runtime: "true"

    - name: Install SwiftLint
      uses: ./.github/actions/setup-swift-tools
      with:
        tools: SwiftLint

    - name: Resolve Package Dependencies
      run: |
        xcodebuild -resolvePackageDependencies \
          -project Pulse.xcodeproj \
          -scheme PulseDev \
          -onlyUsePackageVersionsFromResolvedFile

    # A clean build is required: the analyzer only sees files whose compile
    # commands appear in the log, and an incremental build omits everything it
    # skipped.
    - name: Build with compiler log
      run: |
        set -o pipefail
        xcodebuild build \
          -project Pulse.xcodeproj \
          -scheme PulseDev \
          -destination 'platform=iOS Simulator,name=iPhone Air,OS=latest' \
          -derivedDataPath ./DerivedData \
          -skipMacroValidation \
          CODE_SIGNING_ALLOWED=NO | tee analyze-build.log

    - name: Run SwiftLint analyzer
      continue-on-error: true
      run: |
        swiftlint analyze \
          --config .swiftlint-analyzer.yml \
          --compiler-log-path analyze-build.log \
          --quiet > dead-code.txt 2>&1 || true
        echo "Analyzer produced $(wc -l < dead-code.txt) line(s)"

    - name: Render dead code report
      if: always()
      run: |
        python3 scripts/render-dead-code-report.py dead-code.txt .

    - name: Upload dead code report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: dead-code-report
        path: dead-code.txt
        retention-days: 14
        if-no-files-found: ignore

  # Shared audit body lives in reusable-security-audit.yml (also called by
  # ci.yml with pinned tools). NIGHTLY-ONLY INCREMENTAL VALUE: latest scanner
  # releases re-scan already-merged code with newly-added detector rules the
  # pinned PR gate would never re-evaluate, and gitleaks (latest) sweeps the
  # full history with the root .gitleaks.toml (default ruleset + allowlist).
  security-audit:
    name: Nightly Security Audit
    uses: ./.github/workflows/reusable-security-audit.yml
    permissions:
      contents: read
    with:
      tool-channel: latest
      run-gitleaks: true

  tests:
    name: Nightly ${{ matrix.test-name }}
    runs-on: macos-26
    needs: build
    # Ceiling above the largest per-leg step timeout (180) plus setup — mirrors
    # ci.yml. This was 25, which silently killed the UI-tests leg at the job
    # ceiling every night (the step-level 180 never applied) and kept the
    # nightly permanently red.
    timeout-minutes: 210

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - test-target: PulseTests
            test-name: Unit Tests
            scheme: PulseDev
            artifact-name: scheduled-unit-test-results
            device: iphone
            duration-suite: PulseTests
            timeout: 60
            slow-threshold: 30
          - test-target: PulseUITests
            test-name: UI Tests
            scheme: PulseDev
            artifact-name: scheduled-ui-test-results
            device: iphone
            duration-suite: PulseUITests
            timeout: 180
            slow-threshold: 120
          # The PR runs a focused regular-width smoke set; nightly retains the
          # complete UI target on iPad so device-independent flows still get a
          # periodic second-device pass without dominating every PR.
          - test-target: PulseUITests
            test-name: UI Tests (iPad)
            scheme: PulseDev
            artifact-name: scheduled-ui-ipad-test-results
            device: ipad
            duration-suite: PulseUITests-iPad
            timeout: 180
            slow-threshold: 120
          - test-target: PulseSnapshotTests
            test-name: Snapshot Tests
            scheme: PulseSnapshotTests
            artifact-name: scheduled-snapshot-test-results
            device: iphone
            duration-suite: PulseSnapshotTests
            timeout: 60
            slow-threshold: 30
          # Widget tests were never run in CI at all — this leg gives the
          # nightly the first full-suite signal for widget code.
          - test-target: PulseWidgetExtensionTests
            test-name: Widget Tests
            scheme: PulseDev
            artifact-name: scheduled-widget-test-results
            device: iphone
            duration-suite: PulseWidgetExtensionTests
            timeout: 30
            slow-threshold: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up iOS build environment
      uses: ./.github/actions/setup-ios
      with:
        install-runtime: "true"

    - name: Download build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: scheduled-build-products
        path: ./DerivedData/Build/Products

    - name: Run ${{ matrix.test-name }}
      uses: ./.github/actions/run-ios-tests
      with:
        scheme: ${{ matrix.scheme }}
        test-selectors: ${{ matrix.test-target }}
        test-name: ${{ matrix.test-name }}
        artifact-name: ${{ matrix.artifact-name }}
        device: ${{ matrix.device }}
        flaky-json: flaky-${{ matrix.duration-suite }}.json
        slow-json: slow-${{ matrix.duration-suite }}.json
        slow-threshold: ${{ matrix.slow-threshold }}
        duration-suite: ${{ matrix.duration-suite }}
        retention-days: 5
        timeout-minutes: ${{ matrix.timeout }}

    - name: Upload recorded snapshots
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always() && matrix.test-target == 'PulseSnapshotTests'
      with:
        name: scheduled-recorded-snapshots
        path: PulseSnapshotTests/**/__Snapshots__/**/*.png
        if-no-files-found: ignore

  test-results:
    name: Nightly Test Results
    # Pure bookkeeping (download artifacts + shell) — no Xcode/xcrun, so it runs
    # on ubuntu (10x cheaper than a macOS runner). Mirrors ci.yml.
    runs-on: ubuntu-latest
    needs: [tests]
    if: always()
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
    - name: Harden runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Download unit test results
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      continue-on-error: true
      with:
        name: scheduled-unit-test-results
        path: unit-test-results

    - name: Download UI test results
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      continue-on-error: true
      with:
        name: scheduled-ui-test-results
        path: ui-test-results

    - name: Download snapshot test results
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      continue-on-error: true
      with:
        name: scheduled-snapshot-test-results
        path: snapshot-test-results

    # The nightly runs the whole suite unconditionally every night, which makes
    # it the best flake signal available — but only if someone sees it. Rendered
    # into the job summary rather than a PR comment (there is no PR here).
    - name: Download flaky reports
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      continue-on-error: true
      with:
        pattern: flaky-*
        merge-multiple: true
        path: flaky-reports

    - name: Render flaky report
      id: flaky
      env:
        FLAKY_DIR: flaky-reports
        OUTPUT: flaky-report.md
      run: python3 scripts/render-flaky-report.py

    - name: Append flaky report to job summary
      if: steps.flaky.outputs.has_flakes == 'true'
      run: cat flaky-report.md >> "$GITHUB_STEP_SUMMARY"

    - name: Download slow test reports
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      continue-on-error: true
      with:
        pattern: slow-*
        merge-multiple: true
        path: slow-reports

    - name: Render slow test report
      id: slow
      env:
        SLOW_DIR: slow-reports
        OUTPUT: slow-report.md
      run: python3 scripts/render-slow-report.py

    - name: Append slow test report to job summary
      if: steps.slow.outputs.has_slow == 'true'
      run: cat slow-report.md >> "$GITHUB_STEP_SUMMARY"

    - name: Check test job results
      id: check-results
      run: |
        # Check the outcome of the tests job
        TEST_RESULT="${{ needs.tests.result }}"
        echo "Tests job result: $TEST_RESULT"

        if [ "$TEST_RESULT" == "success" ]; then
          echo "status=success" >> "$GITHUB_OUTPUT"
        else
          echo "status=failure" >> "$GITHUB_OUTPUT"
        fi

    - name: Display Test Results Summary
      run: |
        echo "Scheduled Test Results Summary"
        echo "==============================="
        echo ""

        # Check if artifacts exist and display status
        UNIT_STATUS="Unknown"
        UI_STATUS="Unknown"
        SNAPSHOT_STATUS="Unknown"

        if [ -d "unit-test-results" ]; then
          UNIT_STATUS="Completed"
        else
          UNIT_STATUS="Failed or Missing"
        fi

        if [ -d "ui-test-results" ]; then
          UI_STATUS="Completed"
        else
          UI_STATUS="Failed or Missing"
        fi

        if [ -d "snapshot-test-results" ]; then
          SNAPSHOT_STATUS="Completed"
        else
          SNAPSHOT_STATUS="Failed or Missing"
        fi

        echo "Unit Tests: $UNIT_STATUS"
        echo "UI Tests: $UI_STATUS"
        echo "Snapshot Tests: $SNAPSHOT_STATUS"
        echo ""
        echo "Test artifacts downloaded:"
        ls -la unit-test-results/ 2>/dev/null || echo "  No unit test artifacts found"
        ls -la ui-test-results/ 2>/dev/null || echo "  No UI test artifacts found"
        ls -la snapshot-test-results/ 2>/dev/null || echo "  No snapshot test artifacts found"
        echo ""

        if [ "${{ steps.check-results.outputs.status }}" == "success" ]; then
          echo "All scheduled tests completed successfully!"
        else
          echo "Some tests failed or were cancelled"
        fi
        echo ""
        echo "Daily test run completed at $(date)"

    - name: Fail if tests failed
      if: steps.check-results.outputs.status == 'failure'
      run: |
        echo "::error::Test suite failed or was cancelled"
        exit 1

  # Advisory wall-clock ratchet, the CI-cost counterpart of the app-size /
  # coverage / test-count ratchets in ci.yml — those gate PRs, this one watches
  # the nightly: the only unconditional full-suite run, and the cleanest place
  # to see a runner-image slowdown, suite growth, or a new slow test before it
  # collides with the 180/210-minute ceilings. Same baseline-by-artifact
  # pattern (baseline = the most recent successful run's uploads; a missing
  # baseline is a pass, never a fabricated zero) with a looser per-suite 15%
  # tolerance: shared macOS runners vary far more run-to-run than app size.
  #
  # The baseline has one asymmetry the PR ratchets in ci.yml don't: a red PR
  # never merges, so a master baseline only advances past a change that passed
  # the gate. The nightly has no merge — a legitimate permanent slowdown
  # (a slow new suite, a runner-image change) fails this job, the run goes
  # red, and the success-only walk-back keeps re-reading the pre-slowdown
  # baseline, so the nightly stays red with no self-heal. The escape is the
  # `rebaseline` dispatch input above: a green dispatch on master skips the
  # comparison, and its uploads become the new baseline for the next nightly.
  #
  # Advisory by necessity: notify-failure keys off `test-results` only, so a
  # duration regression makes the run red (visible in the Actions list) without
  # opening a tracking issue — the same posture as the dead-code job.
  duration-ratchet:
    name: CI Duration Ratchet
    runs-on: ubuntu-latest
    needs: [build, tests]
    if: always()
    timeout-minutes: 10

    permissions:
      contents: read
      # `gh run list/download` reads the last successful run's duration artifacts.
      actions: read

    steps:
    - name: Harden runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Download this run's duration reports
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      continue-on-error: true
      with:
        pattern: suite-duration-*
        merge-multiple: true
        path: duration-current

    - name: Fetch baseline duration reports
      id: baseline
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p duration-baseline
        # Walk back a few successful runs: the newest may have been a manual
        # dispatch that cancelled before the duration uploads, or predate the
        # artifacts.
        for RUN_ID in $(gh run list --workflow=scheduled-tests.yml --branch=master \
              --status=success --limit=10 \
              --json databaseId --jq '.[].databaseId'); do
          gh run download "$RUN_ID" --pattern 'suite-duration-*' --merge-multiple \
            --dir duration-baseline >/dev/null 2>&1 || true
          [ -n "$(ls -A duration-baseline 2>/dev/null)" ] && break
        done
        if [ -n "$(ls -A duration-baseline 2>/dev/null)" ]; then
          echo "baseline=duration-baseline" >> "$GITHUB_OUTPUT"
        else
          echo "baseline=none" >> "$GITHUB_OUTPUT"
        fi

    - name: Enforce CI duration ratchet
      env:
        REBASELINE: ${{ inputs.rebaseline }}
      run: |
        # Re-baseline dispatch: no comparison. The run stays green, and the
        # next nightly's success-only walk-back finds it first — its
        # suite-duration uploads are the new baseline.
        if [ "$REBASELINE" = "true" ]; then
          echo "Re-baseline run: comparison skipped; the uploaded durations re-anchor the baseline."
          exit 0
        fi
        # Self-test first: a green nightly only proves this run was fast, never
        # that a regression would be caught.
        echo "Running duration-ratchet self-test..."
        python3 scripts/check-duration-ratchet.py --self-test
        if [ "${{ steps.baseline.outputs.baseline }}" = "none" ]; then
          python3 scripts/check-duration-ratchet.py duration-current none
        else
          python3 scripts/check-duration-ratchet.py duration-current duration-baseline
        fi

  notify-failure:
    name: Nightly Failure Notification
    runs-on: ubuntu-latest
    needs: [test-results]
    if: >-
      always() &&
      needs.test-results.result == 'failure'
    timeout-minutes: 10

    permissions:
      issues: write

    steps:
    - name: Harden runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: Open or update tracking issue
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        GH_SERVER_URL: ${{ github.server_url }}
        GH_RUN_ID: ${{ github.run_id }}
      run: |
        set -euo pipefail

        ISSUE_TITLE="Nightly test run is failing"
        ISSUE_LABEL="nightly-failure"
        RUN_URL="${GH_SERVER_URL}/${GH_REPO}/actions/runs/${GH_RUN_ID}"

        BODY=$(cat <<EOF
        The scheduled nightly test run failed and needs manual attention.

        - Failing run: ${RUN_URL}
        - Date: $(date -u +"%Y-%m-%d %H:%M UTC")

        ---
        _Auto-managed by the scheduled-tests workflow. This issue is updated (not duplicated) on each consecutive red nightly. Close it once the nightly is green again._
        EOF
        )

        # Ensure the dedup label exists (idempotent).
        gh label create "$ISSUE_LABEL" \
          --description "Tracking issue for failing nightly scheduled-tests runs" \
          --color B60205 2>/dev/null || true

        # Find an existing OPEN tracking issue by label + exact title.
        EXISTING=$(gh issue list \
          --state open \
          --label "$ISSUE_LABEL" \
          --search "in:title \"$ISSUE_TITLE\"" \
          --json number,title \
          --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number // empty")

        if [ -n "$EXISTING" ]; then
          echo "Updating existing tracking issue #$EXISTING"
          gh issue comment "$EXISTING" --body "$BODY"
          gh issue edit "$EXISTING" --add-label "$ISSUE_LABEL" >/dev/null 2>&1 || true
        else
          echo "Creating new tracking issue"
          gh issue create \
            --title "$ISSUE_TITLE" \
            --label "$ISSUE_LABEL" \
            --body "$BODY"
        fi

  # Counterpart to notify-failure. Without this the tracking issue is opened
  # automatically but closed by hand ("Close it once the nightly is green
  # again"), which in practice means it lingers after the fix and stops being
  # believed. A green nightly closes it.
  resolve-failure:
    name: Nightly Failure Resolution
    runs-on: ubuntu-latest
    needs: [test-results]
    if: needs.test-results.result == 'success'
    timeout-minutes: 10

    permissions:
      issues: write

    steps:
    - name: Harden runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: Close the tracking issue if the nightly is green
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        GH_SERVER_URL: ${{ github.server_url }}
        GH_RUN_ID: ${{ github.run_id }}
      run: |
        set -euo pipefail

        ISSUE_TITLE="Nightly test run is failing"
        ISSUE_LABEL="nightly-failure"
        RUN_URL="${GH_SERVER_URL}/${GH_REPO}/actions/runs/${GH_RUN_ID}"

        # Same label + exact-title lookup notify-failure uses, so the two
        # always act on the same issue.
        EXISTING=$(gh issue list \
          --state open \
          --label "$ISSUE_LABEL" \
          --search "in:title \"$ISSUE_TITLE\"" \
          --json number,title \
          --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number // empty")

        if [ -z "$EXISTING" ]; then
          echo "No open nightly-failure issue — nothing to close."
          exit 0
        fi

        echo "Nightly is green — closing tracking issue #$EXISTING"
        gh issue comment "$EXISTING" --body "Nightly run is green again: ${RUN_URL}

        Closing automatically."
        gh issue close "$EXISTING" --reason completed
