name: "CodeQL"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: "0 0 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

# Skip Homebrew's auto-update before every `brew install`. Auto-update
# re-evaluates all installed formulae, and any still using the deprecated
# `no_autobump! :requires_manual_review` API emit a warning that GitHub
# Actions promotes to an annotation — flooding each run with dozens of
# identical deprecation warnings. Disabling it removes that phase (and
# speeds installs); the pinned CLI tools are already on the runner image.
env:
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  changes:
    uses: ./.github/workflows/reusable-analysis-changes.yml
    permissions:
      contents: read
    with:
      kind: codeql

  analyze:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Analyze execution
    runs-on: xcode-27
    timeout-minutes: 120
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Shared setup (Select Xcode + brew/SPM caches + xcodegen + generate).
    # install-runtime: false — CodeQL builds against a generic simulator
    # destination and never boots a simulator, so it doesn't need the runtime.
    - name: Set up iOS build environment
      uses: ./.github/actions/setup-ios
      with:
        install-runtime: "false"

    - name: Initialize CodeQL
      id: codeql-init
      uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      with:
        languages: swift
        # security-extended adds the broader security query pack on top of the
        # default high-precision suite — more coverage for a low triage cost on
        # the security scan.
        queries: security-extended

    # macOS 27 ships /usr/bin/sandbox-exec as arm64e-only. The CodeQL tracer
    # re-spawns a re-signed copy of every SIP-protected binary it intercepts,
    # and that copy can't run ("Bad CPU type in executable"). So this
    # analysis-only build turns off everything that spawns sandbox-exec:
    # SwiftPM manifest/plugin evaluation, sandboxed Run Script phases, and
    # swift-frontend's macro-plugin sandbox.
    - name: Build for CodeQL
      id: codeql-build
      run: |
        xcodebuild build \
          -project Pulse.xcodeproj \
          -scheme PulseDev \
          -destination 'generic/platform=iOS Simulator' \
          -onlyUsePackageVersionsFromResolvedFile \
          -skipMacroValidation \
          -IDEPackageSupportDisableManifestSandbox=YES \
          -IDEPackageSupportDisablePluginExecutionSandbox=YES \
          ENABLE_USER_SCRIPT_SANDBOXING=NO \
          OTHER_SWIFT_FLAGS="\$(inherited) -disable-sandbox" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO

    - name: Perform CodeQL Analysis
      id: codeql-analyze
      uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

    - name: Analysis summary
      if: always()
      env:
        INIT: ${{ steps.codeql-init.outcome }}
        BUILD: ${{ steps.codeql-build.outcome }}
        ANALYZE: ${{ steps.codeql-analyze.outcome }}
      run: |
        {
          echo "## CodeQL Analysis (Swift)"
          echo ""
          echo "| Stage | Result |"
          echo "|-------|--------|"
        } >> "$GITHUB_STEP_SUMMARY"
        for row in "Initialize CodeQL:$INIT" \
                   "Build for CodeQL:$BUILD" \
                   "Perform CodeQL Analysis:$ANALYZE"; do
          name="${row%%:*}"
          result="${row##*:}"
          case "$result" in
            success) verdict="Passed" ;;
            skipped) verdict="Skipped" ;;
            *)       verdict="FAILED" ;;
          esac
          echo "| $name | $verdict |" >> "$GITHUB_STEP_SUMMARY"
        done
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "Findings (if any) are reported under the repository's **Security → Code scanning** tab." >> "$GITHUB_STEP_SUMMARY"

  result:
    name: Analyze
    runs-on: ubuntu-latest
    needs: [changes, analyze]
    if: always()
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Verify planned analysis completed
        env:
          DETECTION: ${{ needs.changes.result }}
          PLANNED: ${{ needs.changes.outputs.run }}
          RESULT: ${{ needs.analyze.result }}
        run: |
          if [ "$DETECTION" = success ] && { { [ "$PLANNED" = true ] && [ "$RESULT" = success ]; } || { [ "$PLANNED" = false ] && [ "$RESULT" = skipped ]; }; }; then
            echo "Analyze: $RESULT (planned: $PLANNED)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Analyze did not complete as planned: detection=$DETECTION planned=$PLANNED result=$RESULT"
            exit 1
          fi
