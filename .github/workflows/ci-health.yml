name: CI Health
on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1'
permissions: {}
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report rolling latency and recurring flakes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 scripts/report-ci-health.py --repo "$GH_REPO"
          cat ci-health.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-health
          path: ci-health.md
          retention-days: 90
