name: tmp-rules-permission-probe

# TEMPORARY: determines which GITHUB_TOKEN permission grants can read the rules
# API. Deleted before the PR is merged. Do not merge.

on:
  push:
    branches: [ci/three-new-quality-gates]

permissions: {}

jobs:
  probe-read-all:
    name: "Probe rules API (token: read-all)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: read-all
    steps:
      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          echo "--- token: read-all ---"
          if gh api "repos/${GITHUB_REPOSITORY}/rules/branches/master" --jq 'length' > /tmp/rules-out.txt 2>/tmp/rules-err.txt; then
            echo "rules/branches/master: OK ($(cat /tmp/rules-out.txt) rules)"
          else
            echo "rules/branches/master: FAILED: $(head -c 200 /tmp/rules-err.txt)"
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/rulesets" --jq 'length' > /tmp/rs-out.txt 2>/tmp/rs-err.txt; then
            echo "rulesets: OK ($(cat /tmp/rs-out.txt) rulesets)"
          else
            echo "rulesets: FAILED: $(head -c 200 /tmp/rs-err.txt)"
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/branches/master/protection/required_status_checks" --jq '.enforced' > /tmp/bp-out.txt 2>/tmp/bp-err.txt; then
            echo "legacy protection: OK ($(cat /tmp/bp-out.txt))"
          else
            echo "legacy protection: FAILED: $(head -c 200 /tmp/bp-err.txt)"
          fi

  probe-contents-read:
    name: "Probe rules API (token: contents-read)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          echo "--- token: contents: read ---"
          if gh api "repos/${GITHUB_REPOSITORY}/rules/branches/master" --jq 'length' > /tmp/rules-out.txt 2>/tmp/rules-err.txt; then
            echo "rules/branches/master: OK ($(cat /tmp/rules-out.txt) rules)"
          else
            echo "rules/branches/master: FAILED: $(head -c 200 /tmp/rules-err.txt)"
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/rulesets" --jq 'length' > /tmp/rs-out.txt 2>/tmp/rs-err.txt; then
            echo "rulesets: OK ($(cat /tmp/rs-out.txt) rulesets)"
          else
            echo "rulesets: FAILED: $(head -c 200 /tmp/rs-err.txt)"
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/branches/master/protection/required_status_checks" --jq '.enforced' > /tmp/bp-out.txt 2>/tmp/bp-err.txt; then
            echo "legacy protection: OK ($(cat /tmp/bp-out.txt))"
          else
            echo "legacy protection: FAILED: $(head -c 200 /tmp/bp-err.txt)"
          fi
