name: CI Pipeline

on:
  # Post-merge validation: a PR can be green on its own and still break master
  # when it lands alongside another (semantic conflict). Running the full suite
  # on push catches that before the nightly scheduled run would.
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Deny all permissions by default — each job grants only what it needs
permissions: {}

# Skip Homebrew's auto-update before every `brew install`. Auto-update
# re-evaluates all installed formulae, and any still using the deprecated
# `no_autobump! :requires_manual_review` API emit a warning that GitHub
# Actions promotes to an annotation — flooding each run with dozens of
# identical deprecation warnings. Disabling it removes that phase (and
# speeds installs); the pinned CLI tools are already on the runner image.
env:
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  code-quality:
    name: Code Quality
    runs-on: macos-26
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Shared setup (Select Xcode + brew/SPM caches + xcodegen + generate).
    # install-runtime: false — linting never boots a simulator.
    - name: Set up iOS build environment
      uses: ./.github/actions/setup-ios
      with:
        install-runtime: "false"

    # Mint is specific to this job (SwiftFormat) so its cache stays here rather
    # than in the shared composite.
    # Note: Static version key (mint-v1) - increment manually when mint dependencies change
    - name: Cache Mint packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.mint
        key: ${{ runner.os }}-mint-v1
        restore-keys: |
          ${{ runner.os }}-mint-

    - name: Install Mint
      run: |
        brew install mint

    - name: Install SwiftFormat via Mint
      run: |
        mint install nicklockwood/SwiftFormat

    - name: Install SwiftLint
      run: |
        brew install swiftlint

    # Lint scope includes the two shipped app extensions (PulseShareExtension,
    # PulseWidgetExtension) — they ship to users and are inside the patch-coverage
    # gate, so they should hold the same style bar as the main app. (Test targets
    # are intentionally left out: they carry accepted style-warning noise.)
    - name: Validate SwiftFormat
      run: |
        echo "Running SwiftFormat validation..."
        if mint run swiftformat Pulse PulseTests PulseShareExtension PulseWidgetExtension --lint; then
          echo "SwiftFormat validation passed"
        else
          echo "SwiftFormat validation failed!"
          echo "Please run 'mint run swiftformat Pulse PulseTests PulseShareExtension PulseWidgetExtension' locally to fix formatting issues."
          exit 1
        fi

    - name: Run SwiftLint
      run: |
        echo "Running SwiftLint..."
        if swiftlint lint Pulse PulseTests PulseShareExtension PulseWidgetExtension --reporter github-actions-logging; then
          echo "SwiftLint validation passed"
        else
          echo "SwiftLint found issues!"
          echo "Please run 'swiftlint' locally to see detailed issues."
          exit 1
        fi

    # A dropped/renamed key doesn't fail the build — it silently ships the raw
    # key string (e.g. "common.ok") to users in that language. This gates on
    # en/pt/es having identical key sets per target, and on no duplicate keys.
    - name: Check localization key parity
      run: |
        echo "Checking Localizable.strings key parity across en/pt/es..."
        python3 scripts/check-localization-parity.py .

    # AGENTS.md rule 19. An unguarded `.sink` in a @MainActor interactor crashes
    # `_dispatch_assert_queue_fail` at runtime, on whichever timing-dependent
    # path first delivers off-main — often an error path that no test exercises.
    # Needs multi-line analysis of the publisher chain, so it is a script rather
    # than a SwiftLint custom_rules regex (see the script's docstring).
    - name: Check main-thread Combine sinks
      run: |
        # Self-test first: a clean tree proves the checker reports no false
        # positives, never that it still catches anything. Two false negatives
        # in this script were found in review, not by the tree scan.
        echo "Running sink-checker self-test..."
        python3 scripts/check-mainactor-sinks.py --self-test
        echo "Checking @MainActor interactor sinks for a main-queue hop..."
        python3 scripts/check-mainactor-sinks.py .

  # Shared audit body lives in reusable-security-audit.yml (also called by the
  # nightly with tool-channel: latest). Pinned tools here for reproducible PR
  # gating. The required check context is "Security Audit / Checks".
  security-audit:
    name: Security Audit
    uses: ./.github/workflows/reusable-security-audit.yml
    permissions:
      contents: read
    with:
      tool-channel: pinned
      run-dependency-review: true

  # Decides which of the three test jobs actually need to run, based on which
  # paths changed in the PR. Deterministic path-glob matching only (no
  # heuristics, no LLM) so the same diff always produces the same decision.
  #
  # Fail-safe by construction, not by exception handling:
  #   - Any change under Pulse/** (the shared app source all three suites
  #     exercise) turns ALL three test jobs on — we don't try to prove a
  #     narrower blast radius from the diff alone.
  #   - Shared build/tooling config (project.yml, Package.swift/.resolved,
  #     this workflow file, composite actions, Makefile) also turns all three
  #     on — a broken package or scheme touches every test target.
  #   - Only edits confined to one suite's *own* test directory
  #     (PulseTests/PulseSnapshotTests/PulseUITests) skip the other two.
  #   - `push` events (post-merge validation on master, see header comment)
  #     always run all three regardless of the diff — that job's whole
  #     purpose is catching semantic conflicts between PRs, so it must not
  #     be short-circuited by path filtering.
  #   - "Skipped" is a real job conclusion, not a failure: the required-status
  #     contexts (Unit Tests / Snapshot Tests / UI Tests) still post, GitHub
  #     treats a skipped required check as passing, and downstream jobs that
  #     `needs:` a skipped job are skipped in turn (not failed) by default —
  #     nothing here can wedge a PR.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    # Fail OPEN, not closed: this job must never be the reason tests get
    # skipped. Both steps below carry continue-on-error, so an infra hiccup
    # here (checkout flake, paths-filter error) can never fail this job —
    # which matters because a failed `changes` job would make the downstream
    # `success() && ...` gate on unit-tests/snapshot-tests/ui-tests evaluate
    # false, and those three are GitHub *required* checks that report
    # "skipped" as passing. A `changes` job that quietly failed would
    # therefore let a PR merge with zero tests run. Falling back to "run
    # everything" when detection itself is broken avoids that; only a
    # confirmed, successful path-filter result is allowed to skip a suite.
    outputs:
      unit: ${{ github.event_name != 'pull_request' || steps.filter.outcome != 'success' || steps.filter.outputs.unit == 'true' }}
      snapshot: ${{ github.event_name != 'pull_request' || steps.filter.outcome != 'success' || steps.filter.outputs.snapshot == 'true' }}
      ui: ${{ github.event_name != 'pull_request' || steps.filter.outcome != 'success' || steps.filter.outputs.ui == 'true' }}
      # Gates the two compile jobs. Deliberately the OR of the three suite
      # flags rather than its own filter: `build` exists only to produce the
      # build-products artifact the test jobs consume, so it must run whenever
      # ANY suite runs and is pure waste when none do. Deriving it from the
      # same flags makes disagreement impossible — build can never skip while
      # a test job that needs its artifact still wants to run.
      compile: ${{ github.event_name != 'pull_request' || steps.filter.outcome != 'success' || steps.filter.outputs.unit == 'true' || steps.filter.outputs.snapshot == 'true' || steps.filter.outputs.ui == 'true' }}

    steps:
    # continue-on-error mirrors the two steps below: this job's fail-open
    # contract outranks the hardening, so a harden-runner hiccup must not be
    # what causes a suite to skip.
    - name: Harden runner
      continue-on-error: true
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      continue-on-error: true
      with:
        fetch-depth: 0
        persist-credentials: false

    # Only meaningful (and only run) for pull_request: push always forces all
    # three on above, so there's no diff to compute for that event.
    - name: Filter changed paths
      id: filter
      if: github.event_name == 'pull_request'
      continue-on-error: true
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      with:
        base: ${{ github.event.pull_request.base.sha }}
        filters: |
          shared: &shared
            - 'project.yml'
            - 'Package.swift'
            - 'Package.resolved'
            - '.github/workflows/ci.yml'
            - '.github/actions/**'
            - 'Makefile'
            - 'scripts/**'
            # Not run by any CI job, but it IS in PulseDev's test.targets, so
            # `build-for-testing -scheme PulseDev` compiles it — and the build
            # job is gated on these filters. Without this entry a compile break
            # here would escape PR gating entirely (PulseProd doesn't build any
            # test target, so release-build wouldn't catch it either).
            - 'PulseWidgetExtensionTests/**'
          # `unit` and `snapshot` must BOTH stay supersets of diff-cover's
          # --include net (Pulse, PulseShareExtension, PulseWidgetExtension).
          # patch-coverage needs both jobs, so if either one skips, the whole
          # coverage gate skips — and it is a *required* check, so a skip reads
          # as passing. An extension-only PR would otherwise land with its
          # changed lines silently exempt from the 75% floor. Running snapshot
          # tests for an extension-only change is mild waste; losing the gate
          # is not. Keep these two in sync with the --include list below.
          unit:
            - *shared
            - 'Pulse/**'
            - 'PulseShareExtension/**'
            - 'PulseWidgetExtension/**'
            - 'PulseTests/**'
          snapshot:
            - *shared
            - 'Pulse/**'
            - 'PulseShareExtension/**'
            - 'PulseWidgetExtension/**'
            - 'PulseSnapshotTests/**'
          ui:
            - *shared
            - 'Pulse/**'
            - 'PulseUITests/**'

    - name: Summarize decision
      env:
        RUN_UNIT: ${{ github.event_name != 'pull_request' || steps.filter.outcome != 'success' || steps.filter.outputs.unit == 'true' }}
        RUN_SNAPSHOT: ${{ github.event_name != 'pull_request' || steps.filter.outcome != 'success' || steps.filter.outputs.snapshot == 'true' }}
        RUN_UI: ${{ github.event_name != 'pull_request' || steps.filter.outcome != 'success' || steps.filter.outputs.ui == 'true' }}
        RUN_COMPILE: ${{ github.event_name != 'pull_request' || steps.filter.outcome != 'success' || steps.filter.outputs.unit == 'true' || steps.filter.outputs.snapshot == 'true' || steps.filter.outputs.ui == 'true' }}
      run: |
        {
          echo "## Test Plan"
          echo ""
          echo "| Job | Will run |"
          echo "|-----|----------|"
          echo "| Build Project | $RUN_COMPILE |"
          echo "| Release Build | $RUN_COMPILE |"
          echo "| Unit Tests | $RUN_UNIT |"
          echo "| Snapshot Tests | $RUN_SNAPSHOT |"
          echo "| UI Tests | $RUN_UI |"
        } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build Project
    runs-on: macos-26
    needs: [code-quality, changes]
    if: success() && needs.changes.outputs.compile == 'true'
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up iOS build environment
      uses: ./.github/actions/setup-ios
      with:
        install-runtime: "true"

    - name: Debug Package Dependencies
      run: |
        echo "Checking package dependencies..."
        if [ -d "Pulse.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/" ]; then
          ls -la Pulse.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/
          echo "Package.resolved content:"
          cat Pulse.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved || echo "Package.resolved not found"
        else
          echo "Swift PM directory not found (this is normal for a fresh project generation)"
        fi

    - name: Resolve Package Dependencies
      run: |
        echo "Explicitly resolving Swift Package Manager dependencies..."
        xcodebuild -resolvePackageDependencies \
          -project Pulse.xcodeproj \
          -scheme PulseDev \
          -onlyUsePackageVersionsFromResolvedFile
        echo "Package dependencies resolved successfully"

    # Both build steps tee to build.log so the warning gate below can read the
    # full diagnostic stream. `pipefail` keeps a compile failure fatal despite
    # the pipe into tee.
    - name: Build for testing (PulseDev)
      run: |
        echo "Building PulseDev scheme for testing..."
        set -o pipefail
        xcodebuild build-for-testing \
          -project Pulse.xcodeproj \
          -scheme PulseDev \
          -destination 'platform=iOS Simulator,name=iPhone Air,OS=latest' \
          -derivedDataPath ./DerivedData \
          -enableCodeCoverage YES \
          -skipMacroValidation \
          ENABLE_ONLY_ACTIVE_RESOURCES=NO | tee -a build.log

    - name: Build for testing (PulseSnapshotTests)
      run: |
        echo "Building PulseSnapshotTests scheme for testing..."
        set -o pipefail
        xcodebuild build-for-testing \
          -project Pulse.xcodeproj \
          -scheme PulseSnapshotTests \
          -destination 'platform=iOS Simulator,name=iPhone Air,OS=latest' \
          -derivedDataPath ./DerivedData \
          -enableCodeCoverage YES \
          -skipMacroValidation \
          ENABLE_ONLY_ACTIVE_RESOURCES=NO | tee -a build.log

    # The tree is warning-clean as of 57870746; this keeps it that way. Scoped
    # to first-party paths rather than SWIFT_TREAT_WARNINGS_AS_ERRORS, which
    # would also fail on warnings inside SwiftPM dependencies we cannot fix.
    - name: Check for compiler warnings
      run: |
        python3 scripts/check-build-warnings.py build.log .

    # Only Build/Products is uploaded — that's all test-without-building needs
    # (the .xctestrun files and app/test bundles live there). The rest of
    # DerivedData (Intermediates.noindex, ModuleCache, SourcePackages) is the
    # bulk of the directory and dead weight for the four downstream downloads.
    - name: Upload build artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: build-products
        path: ./DerivedData/Build/Products
        retention-days: 1

  # The matrix above compiles Debug. Release exercises a genuinely different
  # path: whole-module optimization (vs -Onone singlefile), dead-code stripping,
  # and — specific to Pulse — the `#if DEBUG` API-key env-var fallback compiled
  # out. We build for the *simulator* on purpose: a device (iphoneos) Release
  # build trips the "Upload dSYMs to Crashlytics" phase, which requires the
  # production GoogleService-Info.plist (a secret, not in the repo). The simulator
  # skips that phase (PLATFORM_NAME != iphoneos), so this stays credential-free
  # while still catching Release-only compile breaks. Mirrors `make build-release`.
  release-build:
    name: Release Build
    runs-on: macos-26
    needs: [code-quality, changes]
    if: success() && needs.changes.outputs.compile == 'true'
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up iOS build environment
      uses: ./.github/actions/setup-ios
      with:
        install-runtime: "true"

    - name: Resolve Package Dependencies
      run: |
        xcodebuild -resolvePackageDependencies \
          -project Pulse.xcodeproj \
          -scheme PulseProd \
          -onlyUsePackageVersionsFromResolvedFile

    # Simulator destination so the device-only "Upload dSYMs to Crashlytics" guard
    # phase is skipped (no GoogleService-Info.plist needed). CODE_SIGNING_ALLOWED=NO
    # keeps it credential-free — this validates the Release compile, not signing.
    - name: Build PulseProd (Release, simulator)
      run: |
        set -o pipefail
        xcodebuild build \
          -project Pulse.xcodeproj \
          -scheme PulseProd \
          -configuration Release \
          -destination 'platform=iOS Simulator,name=iPhone Air,OS=latest' \
          -onlyUsePackageVersionsFromResolvedFile \
          -skipMacroValidation \
          CODE_SIGNING_ALLOWED=NO | tee -a build-release.log

    # Release compiles whole-module with dead-code stripping and drops the
    # `#if DEBUG` branches, so it surfaces diagnostics the Debug build cannot.
    - name: Check for compiler warnings
      run: |
        python3 scripts/check-build-warnings.py build-release.log .

  # Split into three independent jobs (rather than one Unit/UI/UI-iPad/Snapshot
  # matrix) so patch-coverage — which only consumes the unit + snapshot xcresults —
  # can start as soon as those two finish, instead of waiting on the much longer
  # (180min) and flakier UI Tests legs, and so a UI Tests failure doesn't skip
  # patch-coverage entirely (job-level `needs` treats a matrix job as one unit:
  # any failing leg fails the whole thing).
  unit-tests:
    name: Unit Tests
    runs-on: macos-26
    needs: [build, changes]
    if: success() && needs.changes.outputs.unit == 'true'
    timeout-minutes: 75

    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up iOS build environment
      uses: ./.github/actions/setup-ios
      with:
        install-runtime: "true"

    - name: Download build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: build-products
        path: ./DerivedData/Build/Products

    - name: Run Unit Tests
      timeout-minutes: 60
      env:
        SCHEME: PulseDev
        TEST_TARGET: PulseTests
        ARTIFACT_NAME: unit-test-results
        TEST_NAME: Unit Tests
      run: |
        mkdir -p test-results
        set -o pipefail

        DEST="platform=iOS Simulator,name=iPhone Air,OS=latest"
        echo "Test destination: $DEST"

        xcodebuild test-without-building \
          -project Pulse.xcodeproj \
          -scheme "$SCHEME" \
          -only-testing:"$TEST_TARGET" \
          -destination "$DEST" \
          -derivedDataPath ./DerivedData \
          -resultBundlePath "test-results/${ARTIFACT_NAME}.xcresult" \
          -enableCodeCoverage YES \
          -disableAutomaticPackageResolution \
          -retry-tests-on-failure \
          2>&1 | tee /tmp/test_output.log

        TEST_EXIT_CODE=${PIPESTATUS[0]}

        echo ""
        echo "============================================"
        echo "              TEST SUMMARY"
        echo "============================================"
        grep -E "(Test Suite.*started|Test Suite.*passed|Test Suite.*failed|Executed [0-9]+ test)" /tmp/test_output.log | tail -10 || echo "$TEST_NAME completed"

        exit $TEST_EXIT_CODE

    - name: Extract and display test failures
      if: failure()
      run: python3 scripts/extract-test-failures.py
      env:
        RESULT_BUNDLE: test-results/unit-test-results.xcresult
        TEST_NAME: Unit Tests

    # `if: success()` is the whole detection precondition — see the script
    # docstring. A failure recorded in a bundle whose suite passed can only
    # have been recovered by -retry-tests-on-failure.
    - name: Detect flaky tests
      if: success()
      run: python3 scripts/detect-flaky-tests.py
      env:
        RESULT_BUNDLE: test-results/unit-test-results.xcresult
        TEST_NAME: Unit Tests
        FLAKY_JSON: flaky-unit.json

    - name: Upload flaky test report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: success()
      with:
        name: flaky-unit
        path: flaky-unit.json
        if-no-files-found: ignore

    - name: Upload test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: unit-test-results
        path: test-results/unit-test-results.xcresult
        if-no-files-found: warn

  snapshot-tests:
    name: Snapshot Tests
    runs-on: macos-26
    needs: [build, changes]
    if: success() && needs.changes.outputs.snapshot == 'true'
    timeout-minutes: 75

    permissions:
      contents: read
      # For the sticky snapshot-failure comment posted at the end of this job.
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up iOS build environment
      uses: ./.github/actions/setup-ios
      with:
        install-runtime: "true"

    - name: Download build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: build-products
        path: ./DerivedData/Build/Products

    - name: Run Snapshot Tests
      timeout-minutes: 60
      env:
        SCHEME: PulseSnapshotTests
        TEST_TARGET: PulseSnapshotTests
        ARTIFACT_NAME: snapshot-test-results
        TEST_NAME: Snapshot Tests
      run: |
        mkdir -p test-results
        set -o pipefail

        DEST="platform=iOS Simulator,name=iPhone Air,OS=latest"
        echo "Test destination: $DEST"

        xcodebuild test-without-building \
          -project Pulse.xcodeproj \
          -scheme "$SCHEME" \
          -only-testing:"$TEST_TARGET" \
          -destination "$DEST" \
          -derivedDataPath ./DerivedData \
          -resultBundlePath "test-results/${ARTIFACT_NAME}.xcresult" \
          -enableCodeCoverage YES \
          -disableAutomaticPackageResolution \
          -retry-tests-on-failure \
          2>&1 | tee /tmp/test_output.log

        TEST_EXIT_CODE=${PIPESTATUS[0]}

        echo ""
        echo "============================================"
        echo "              TEST SUMMARY"
        echo "============================================"
        grep -E "(Test Suite.*started|Test Suite.*passed|Test Suite.*failed|Executed [0-9]+ test)" /tmp/test_output.log | tail -10 || echo "$TEST_NAME completed"

        exit $TEST_EXIT_CODE

    - name: Extract and display test failures
      if: failure()
      run: python3 scripts/extract-test-failures.py
      env:
        RESULT_BUNDLE: test-results/snapshot-test-results.xcresult
        TEST_NAME: Snapshot Tests

    - name: Detect flaky tests
      if: success()
      run: python3 scripts/detect-flaky-tests.py
      env:
        RESULT_BUNDLE: test-results/snapshot-test-results.xcresult
        TEST_NAME: Snapshot Tests
        FLAKY_JSON: flaky-snapshot.json

    - name: Upload flaky test report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: success()
      with:
        name: flaky-snapshot
        path: flaky-snapshot.json
        if-no-files-found: ignore

    - name: Upload test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: snapshot-test-results
        path: test-results/snapshot-test-results.xcresult
        if-no-files-found: warn

    - name: Upload recorded snapshots
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: recorded-snapshots
        path: PulseSnapshotTests/**/__Snapshots__/**/*.png
        if-no-files-found: ignore

    # Surfaces the failing cases on the PR itself with a direct link to the
    # recorded-snapshots artifact, instead of making the reader dig through the
    # run UI. Images are linked, not inlined — see the script docstring.
    - name: Render snapshot failure report
      id: snapshot-report
      if: failure() && github.event_name == 'pull_request'
      env:
        RESULT_BUNDLE: test-results/snapshot-test-results.xcresult
        OUTPUT: snapshot-failures.md
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: python3 scripts/render-snapshot-failures.py

    # `always() &&` is load-bearing: this step only ever runs after the test
    # step has already failed, and a step whose `if:` omits always()/failure()
    # is skipped once the job is in a failed state — so without it the comment
    # would never post in the one case it exists for.
    - name: Post snapshot failures as PR comment
      if: always() && steps.snapshot-report.outputs.has_failures == 'true'
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        header: snapshot-failures
        path: snapshot-failures.md

    # A green snapshot run clears any comment left by an earlier red commit.
    - name: Remove stale snapshot failure comment
      if: success() && github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        header: snapshot-failures
        delete: true

  # NOTE: these two jobs were deliberately de-matrixed. A `name:` containing
  # `${{ matrix.* }}` is NOT interpolated when the job is skipped by a
  # job-level `if:` — the matrix never expands, so GitHub posts a single
  # check run under the literal string "matrix.test-name". That left the
  # *required* "UI Tests" context permanently "Expected" and blocked every
  # PR the path filter skipped (observed on #437). Static job names are the
  # only way to guarantee the required context is posted in both the run and
  # the skip case, so the iPhone and iPad legs are spelled out separately.
  # Keep their steps in sync when editing.
  ui-tests:
    name: UI Tests
    runs-on: macos-26
    needs: [build, changes]
    if: success() && needs.changes.outputs.ui == 'true'
    # Ceiling above the per-leg step timeout (180) plus setup. The real
    # per-run bound is the step-level timeout below; this is just runaway
    # insurance for the setup/download steps.
    timeout-minutes: 210

    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up iOS build environment
      uses: ./.github/actions/setup-ios
      with:
        install-runtime: "true"

    - name: Download build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: build-products
        path: ./DerivedData/Build/Products

    - name: Run UI Tests
      timeout-minutes: 180
      env:
        SCHEME: PulseDev
        TEST_TARGET: PulseUITests
        ARTIFACT_NAME: ui-test-results
        TEST_NAME: UI Tests
      run: |
        mkdir -p test-results
        set -o pipefail

        # iPhone Air, matching the build job's simulator.
        DEST="platform=iOS Simulator,name=iPhone Air,OS=latest"
        echo "Test destination: $DEST"

        # No -enableCodeCoverage here: patch-coverage only consumes the unit +
        # snapshot xcresults, so collecting coverage on the slowest legs was
        # pure overhead.
        xcodebuild test-without-building \
          -project Pulse.xcodeproj \
          -scheme "$SCHEME" \
          -only-testing:"$TEST_TARGET" \
          -destination "$DEST" \
          -derivedDataPath ./DerivedData \
          -resultBundlePath "test-results/${ARTIFACT_NAME}.xcresult" \
          -disableAutomaticPackageResolution \
          -retry-tests-on-failure \
          2>&1 | tee /tmp/test_output.log

        TEST_EXIT_CODE=${PIPESTATUS[0]}

        echo ""
        echo "============================================"
        echo "              TEST SUMMARY"
        echo "============================================"
        grep -E "(Test Suite.*started|Test Suite.*passed|Test Suite.*failed|Executed [0-9]+ test)" /tmp/test_output.log | tail -10 || echo "$TEST_NAME completed"

        exit $TEST_EXIT_CODE

    - name: Extract and display test failures
      if: failure()
      run: python3 scripts/extract-test-failures.py
      env:
        RESULT_BUNDLE: test-results/ui-test-results.xcresult
        TEST_NAME: UI Tests

    - name: Detect flaky tests
      if: success()
      run: python3 scripts/detect-flaky-tests.py
      env:
        RESULT_BUNDLE: test-results/ui-test-results.xcresult
        TEST_NAME: UI Tests
        FLAKY_JSON: flaky-ui.json

    - name: Upload flaky test report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: success()
      with:
        name: flaky-ui
        path: flaky-ui.json
        if-no-files-found: ignore

    - name: Upload test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: ui-test-results
        path: test-results/ui-test-results.xcresult
        if-no-files-found: warn

  # iPad = regular size class, where the adaptive paths live
  # (NavigationSplitView, LazyVGrid vs LazyVStack, the 720pt detail cap).
  # The iPhone job above only ever exercises compact width. Reuses the same
  # simulator build products (test-without-building).
  ui-tests-ipad:
    name: UI Tests (iPad)
    runs-on: macos-26
    needs: [build, changes]
    if: success() && needs.changes.outputs.ui == 'true'
    timeout-minutes: 210

    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up iOS build environment
      uses: ./.github/actions/setup-ios
      with:
        install-runtime: "true"

    - name: Download build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: build-products
        path: ./DerivedData/Build/Products

    - name: Run UI Tests (iPad)
      timeout-minutes: 180
      env:
        SCHEME: PulseDev
        TEST_TARGET: PulseUITests
        ARTIFACT_NAME: ui-test-results-ipad
        TEST_NAME: UI Tests (iPad)
      run: |
        mkdir -p test-results
        set -o pipefail

        # Dynamically-discovered iPad so the destination survives runner-image
        # changes, preferring a Pro model.
        DEVICE=$(xcrun simctl list devices available --json \
          | jq -r '[.devices[][] | select(.isAvailable and (.name | startswith("iPad"))) | .name]
                   | (map(select(test("Pro"))) + .)[0] // empty')
        [ -z "$DEVICE" ] && DEVICE="iPad Pro 13-inch (M4)"
        DEST="platform=iOS Simulator,name=$DEVICE,OS=latest"
        echo "Test destination: $DEST"

        xcodebuild test-without-building \
          -project Pulse.xcodeproj \
          -scheme "$SCHEME" \
          -only-testing:"$TEST_TARGET" \
          -destination "$DEST" \
          -derivedDataPath ./DerivedData \
          -resultBundlePath "test-results/${ARTIFACT_NAME}.xcresult" \
          -disableAutomaticPackageResolution \
          -retry-tests-on-failure \
          2>&1 | tee /tmp/test_output.log

        TEST_EXIT_CODE=${PIPESTATUS[0]}

        echo ""
        echo "============================================"
        echo "              TEST SUMMARY"
        echo "============================================"
        grep -E "(Test Suite.*started|Test Suite.*passed|Test Suite.*failed|Executed [0-9]+ test)" /tmp/test_output.log | tail -10 || echo "$TEST_NAME completed"

        exit $TEST_EXIT_CODE

    - name: Extract and display test failures
      if: failure()
      run: python3 scripts/extract-test-failures.py
      env:
        RESULT_BUNDLE: test-results/ui-test-results-ipad.xcresult
        TEST_NAME: UI Tests (iPad)

    - name: Detect flaky tests
      if: success()
      run: python3 scripts/detect-flaky-tests.py
      env:
        RESULT_BUNDLE: test-results/ui-test-results-ipad.xcresult
        TEST_NAME: UI Tests (iPad)
        FLAKY_JSON: flaky-ui-ipad.json

    - name: Upload flaky test report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: success()
      with:
        name: flaky-ui-ipad
        path: flaky-ui-ipad.json
        if-no-files-found: ignore

    - name: Upload test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: ui-test-results-ipad
        path: test-results/ui-test-results-ipad.xcresult
        if-no-files-found: warn

  patch-coverage:
    name: Patch Coverage
    runs-on: macos-26
    needs: [unit-tests, snapshot-tests]
    if: github.event_name == 'pull_request'
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: write

    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      THRESHOLD: '75'

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        # The base-ref fetch below works unauthenticated (public repo), so no
        # credential needs to persist in .git/config.
        persist-credentials: false

    - name: Ensure base ref is present
      run: git fetch --no-tags --depth=200 origin "$BASE_SHA" || true

    # Xcode is needed only for xcresulttool (via xcresult-to-cobertura.py) —
    # no simulator, no project generation.
    - name: Set up iOS build environment
      uses: ./.github/actions/setup-ios
      with:
        install-runtime: "false"
        generate-project: "false"

    - name: Download unit test results
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: unit-test-results
        path: artifacts/unit

    - name: Download snapshot test results
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: snapshot-test-results
        path: artifacts/snap

    - name: Install diff-cover
      run: |
        pipx install diff-cover
        pipx ensurepath || true

    # actions/upload-artifact uploads a directory's *contents* (not the directory
    # itself), so the downloaded artifacts land directly inside artifacts/unit
    # and artifacts/snap — those paths are the xcresult bundles.
    - name: Convert xcresult bundles to Cobertura
      run: |
        python3 scripts/xcresult-to-cobertura.py artifacts/unit \
          --project-root "$PWD" -o unit-coverage.xml
        python3 scripts/xcresult-to-cobertura.py artifacts/snap \
          --project-root "$PWD" -o snap-coverage.xml

    # diff-cover's --include/--exclude use argparse nargs='+' and internally
    # resolve patterns via glob.glob(recursive=True), NOT fnmatch. Two
    # consequences:
    #   1. Repeating `--include` only keeps the last value — all patterns must
    #      follow a single --include flag.
    #   2. `**/` is required to recurse; `Pulse/*.swift` only matches files
    #      directly inside `Pulse/`, so nested files (Pulse/Home/Foo.swift)
    #      get silently dropped without `**`.
    # The `|| RESULT=$?` dance ensures the markdown report always lands in the
    # job summary, not just on the happy path — `bash -e` would otherwise skip
    # it when diff-cover exits non-zero on a threshold failure.
    # LiveAuthService is excluded because it is direct glue over the Firebase
    # Auth, GoogleSignIn, and ASAuthorizationController singletons — none of
    # which expose protocol seams for unit-test mocking, and instantiating
    # `LiveAuthService` without `FirebaseApp.configure()` (not invoked by the
    # test bundle) fatal-errors. PulseTests/Configs/LiveServicesBasicTests.swift
    # documents the same constraint with `#expect(true)` placeholders.
    # Auth business logic is exercised at the domain layer through the
    # AuthService protocol + MockAuthService.
    #
    # LiveAuthService+Anonymous is split from LiveAuthService to keep the
    # parent file under SwiftLint's file-length budget; it wraps
    # `Auth.auth().signInAnonymously()` and carries the same un-mockable
    # Firebase Auth dependency. Same justification as LiveAuthService.
    # Reviewer flow is exercised at the domain layer through
    # AuthDomainInteractorTests and SignInViewModelTests.
    #
    # FirebaseUser+AuthUser is the same kind of glue — an extension on the
    # non-mockable `FirebaseAuth.User` reference type — and was extracted
    # from LiveAuthService purely to keep that file under SwiftLint's
    # file-length budget. Same justification as LiveAuthService applies.
    #
    # SignOutCleanup is direct glue over the Security framework's `SecItem*`
    # C API and the `CKContainer` singleton; neither exposes a protocol seam
    # without inverting the helper into a parameterised abstraction. Happy
    # paths are exercised end-to-end through SettingsViewModelSignOutTests
    # (62% line coverage today). The remaining lines are the warning-log
    # branch on `SecItemDelete` returning a non-success/non-not-found OSStatus
    # and the success-log branch inside a `Task.detached` doing real CloudKit
    # zone deletion — both require simulating external-SDK failure modes.
    #
    # ShareViewController is the principal class for the Share Extension —
    # a UIViewController subclass tied to `extensionContext` (read-only at
    # runtime) and the `NSItemProvider` callback. The URL-validation logic
    # it dispatches into is unit-tested through SharedURLQueueTests, so the
    # only uncovered code is the UIKit lifecycle around it.
    #
    # LLMModelManager + LiveLLMService are direct glue over the vendored
    # SwiftLlama / llama.cpp + Metal stack. The 600 MB model is never loaded in
    # CI, so the generation / inference paths cannot execute under test. The
    # LLMService protocol is exercised at the domain layer through mocks
    # (SummarizationDomainInteractorTests, FeedDomainInteractorTests). Same
    # un-mockable-singleton justification as LiveAuthService.
    #
    # LiveTextToSpeechService is glue over AVSpeechSynthesizer + AVAudioSession +
    # MPRemoteCommandCenter / MPNowPlayingInfoCenter — system singletons with no
    # protocol seam. Driven through the TextToSpeechService protocol +
    # MockTextToSpeechService at the domain layer (ArticleDetailTTSInteractorTests).
    #
    # TTSLiveActivityController wraps ActivityKit, which requires a running app
    # context (no Activity can be requested / updated in the unit-test host) and
    # is a `.shared` singleton with no seam.
    #
    # The WidgetKit declarative UI — TTSLiveActivity (the Live Activity lock-screen
    # / Dynamic Island views), PulseNewsWidget (the home-screen widget view), and
    # PulseWidgetBundle (the @main WidgetBundle entry point) — only renders inside a
    # widget / Activity host, so there is no unit-test seam (same category as
    # TTSLiveActivityController above and the PulseSceneDelegate composition root
    # below). The testable widget code — NewsTimelineProvider, SharedArticle,
    # SharedDataManager — stays in the coverage net.
    #
    # LiveStoreKitService is glue over StoreKit 2's Transaction.currentEntitlements
    # / Transaction.updates async sequences; exercising them needs an SKTestSession
    # harness not present in the suite (tracked as a follow-up). StoreKitService is
    # mocked at the domain layer (MockStoreKitService, PaywallDomainInteractorTests).
    #
    # PulseSceneDelegate is the composition root — UIWindowSceneDelegate lifecycle
    # plus service registration; not unit-testable, same category as
    # ShareViewController.
    #
    # SettingsView / ArticleDetailView / FeedView host the StoreKit-2 premium
    # re-verification as SwiftUI lifecycle glue (`.task`/`.onAppear` calling
    # `refreshSubscriptionStatus()` + a cache-seed), which has no protocol seam
    # for plain xctest. The re-verify contract is covered at the service layer
    # (StoreKitService protocol + Mock/Live tests); the views are the same
    # untestable-lifecycle category as the entries above.
    #
    # VideoPlayerView is a UIViewRepresentable wrapping WKWebView — its updateUIView
    # lifecycle has no protocol seam for plain xctest. Its one security-relevant
    # decision (the HTTPS-only inline-load gate, isSafeInlineVideoURL) IS unit-tested
    # in VideoPlayerViewTests; only the UIKit glue is excluded.
    - name: Enforce patch coverage threshold
      run: |
        RESULT=0
        diff-cover unit-coverage.xml snap-coverage.xml \
          --compare-branch "$BASE_SHA" \
          --fail-under "$THRESHOLD" \
          --include 'Pulse/**/*.swift' 'PulseShareExtension/**/*.swift' 'PulseWidgetExtension/**/*.swift' \
           --exclude '**/*+Preview.swift' '**/Preview Content/**' \
                     '**/LiveAuthService.swift' '**/LiveAuthService+Anonymous.swift' \
                     '**/FirebaseUser+AuthUser.swift' \
                     '**/SignOutCleanup.swift' '**/ShareViewController.swift' \
                     '**/LiveAnalyticsService.swift' '**/ShareRootView.swift' \
                     '**/NewsTimelineProvider.swift' '**/SearchPulseIntent.swift' \
                     '**/SharedDataManager.swift' '**/LLMModelManager.swift' '**/LiveLLMService.swift' \
                     '**/LiveTextToSpeechService.swift' \
                     '**/TTSLiveActivityController.swift' \
                    '**/TTSLiveActivity.swift' '**/PulseNewsWidget.swift' \
                    '**/PulseWidgetBundle.swift' \
                    '**/LiveStoreKitService.swift' \
                    '**/PulseSceneDelegate.swift' \
                    '**/SettingsView.swift' '**/ArticleDetailView.swift' '**/FeedView.swift' \
                    '**/VideoPlayerView.swift' \
          --markdown-report patch-coverage.md || RESULT=$?
        {
          echo "## Patch Coverage Report"
          echo ""
          cat patch-coverage.md
        } >> "$GITHUB_STEP_SUMMARY"
        exit $RESULT

    # Post the same diff-cover markdown as a sticky PR comment, updated in place
    # on each push (header acts as the marker). `if: always()` is load-bearing —
    # the threshold step exits non-zero when coverage drops below the floor,
    # which is exactly when you most want the report visible on the PR.
    - name: Post patch coverage as PR comment
      if: always() && hashFiles('patch-coverage.md') != ''
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        header: patch-coverage
        path: patch-coverage.md

    - name: Upload patch coverage report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: patch-coverage-report
        path: patch-coverage.md
        if-no-files-found: warn

  test-results:
    name: Test Results Summary
    # Pure bookkeeping (download artifacts + shell) — no Xcode/xcrun, so it runs
    # on ubuntu (10x cheaper than a macOS runner).
    runs-on: ubuntu-latest
    needs: [unit-tests, snapshot-tests, ui-tests, ui-tests-ipad]
    if: always()
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
    - name: Harden runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Download unit test results
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      continue-on-error: true
      with:
        name: unit-test-results
        path: unit-test-results

    - name: Download UI test results
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      continue-on-error: true
      with:
        name: ui-test-results
        path: ui-test-results

    - name: Download UI test results (iPad)
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      continue-on-error: true
      with:
        name: ui-test-results-ipad
        path: ui-test-results-ipad

    - name: Download snapshot test results
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      continue-on-error: true
      with:
        name: snapshot-test-results
        path: snapshot-test-results

    - name: Check test job results
      id: check-results
      run: |
        # Check the outcome of the unit/snapshot/UI test jobs
        UNIT_RESULT="${{ needs.unit-tests.result }}"
        SNAPSHOT_RESULT="${{ needs.snapshot-tests.result }}"
        UI_RESULT="${{ needs.ui-tests.result }}"
        UI_IPAD_RESULT="${{ needs.ui-tests-ipad.result }}"
        echo "Unit Tests job result: $UNIT_RESULT"
        echo "Snapshot Tests job result: $SNAPSHOT_RESULT"
        echo "UI Tests job result: $UI_RESULT"
        echo "UI Tests (iPad) job result: $UI_IPAD_RESULT"

        # "skipped" is a deliberate outcome from the changes-detection job
        # (path filtering decided this suite didn't need to run) and must be
        # treated the same as "success" here, or every PR that skips a suite
        # would fail this required check.
        is_ok() { [ "$1" == "success" ] || [ "$1" == "skipped" ]; }

        if is_ok "$UNIT_RESULT" && is_ok "$SNAPSHOT_RESULT" && is_ok "$UI_RESULT" && is_ok "$UI_IPAD_RESULT"; then
          echo "status=success" >> $GITHUB_OUTPUT
        else
          echo "status=failure" >> $GITHUB_OUTPUT
        fi

    - name: Display Test Results Summary
      run: |
        echo "Test Results Summary"
        echo "===================="
        echo ""

        # Check if artifacts exist and display status
        UNIT_STATUS="Unknown"
        UI_STATUS="Unknown"
        UI_IPAD_STATUS="Unknown"
        SNAPSHOT_STATUS="Unknown"

        if [ -d "unit-test-results" ]; then
          UNIT_STATUS="Completed"
        elif [ "${{ needs.unit-tests.result }}" == "skipped" ]; then
          UNIT_STATUS="Skipped (no relevant changes)"
        else
          UNIT_STATUS="Failed or Missing"
        fi

        if [ -d "ui-test-results" ]; then
          UI_STATUS="Completed"
        elif [ "${{ needs.ui-tests.result }}" == "skipped" ]; then
          UI_STATUS="Skipped (no relevant changes)"
        else
          UI_STATUS="Failed or Missing"
        fi

        if [ -d "ui-test-results-ipad" ]; then
          UI_IPAD_STATUS="Completed"
        elif [ "${{ needs.ui-tests-ipad.result }}" == "skipped" ]; then
          UI_IPAD_STATUS="Skipped (no relevant changes)"
        else
          UI_IPAD_STATUS="Failed or Missing"
        fi

        if [ -d "snapshot-test-results" ]; then
          SNAPSHOT_STATUS="Completed"
        elif [ "${{ needs.snapshot-tests.result }}" == "skipped" ]; then
          SNAPSHOT_STATUS="Skipped (no relevant changes)"
        else
          SNAPSHOT_STATUS="Failed or Missing"
        fi

        echo "Unit Tests: $UNIT_STATUS"
        echo "UI Tests: $UI_STATUS"
        echo "UI Tests (iPad): $UI_IPAD_STATUS"
        echo "Snapshot Tests: $SNAPSHOT_STATUS"
        echo ""
        echo "Test artifacts downloaded:"
        ls -la unit-test-results/ 2>/dev/null || echo "  No unit test artifacts found"
        ls -la ui-test-results/ 2>/dev/null || echo "  No UI test artifacts found"
        ls -la ui-test-results-ipad/ 2>/dev/null || echo "  No UI test (iPad) artifacts found"
        ls -la snapshot-test-results/ 2>/dev/null || echo "  No snapshot test artifacts found"
        echo ""

        if [ "${{ steps.check-results.outputs.status }}" == "success" ]; then
          echo "All tests completed successfully!"
        else
          echo "Some tests failed or were cancelled"
        fi

    - name: Fail if tests failed
      if: steps.check-results.outputs.status == 'failure'
      run: |
        echo "::error::Test suite failed or was cancelled"
        exit 1

  coverage-summary:
    name: Coverage Summary
    runs-on: macos-26
    needs: unit-tests
    # Only meaningful when unit-tests actually produced an xcresult. Previously
    # `always()`, which booted a macOS runner just to print "no bundle
    # available" on every PR the path filter skipped. Not a required check, so
    # skipping it here is free.
    if: needs.unit-tests.result == 'success'
    timeout-minutes: 10

    permissions:
      contents: read
      # `gh run download` reads the coverage baseline artifact published by the
      # last successful master run.
      actions: read

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Xcode is needed only for `xcrun xccov` — no simulator, no project.
    - name: Set up iOS build environment
      uses: ./.github/actions/setup-ios
      with:
        install-runtime: "false"
        generate-project: "false"

    - name: Download unit test results
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      continue-on-error: true
      with:
        name: unit-test-results
        path: coverage-xcresult

    # Overall app-target line coverage — complements the Patch Coverage gate,
    # which only measures *changed* lines. Gated by the ratchet step below: a
    # PR may not drop overall coverage more than 1pt under the master baseline.
    - name: Report overall coverage
      run: |
        # actions/upload-artifact drops the top-level directory name, so the
        # download holds the bundle's *contents* (Data/ + Info.plist), not a
        # `*.xcresult` directory — the shape patch-coverage already documents.
        # The old `find` therefore never matched and this job silently reported
        # "no bundle" on every run. xccov only accepts a path carrying the
        # .xcresult extension, so restore one.
        BUNDLE=""
        if [ -f coverage-xcresult/Info.plist ]; then
          mv coverage-xcresult unit-results.xcresult
          BUNDLE="unit-results.xcresult"
        else
          BUNDLE=$(find coverage-xcresult -maxdepth 2 -name '*.xcresult' -type d 2>/dev/null | head -1)
        fi
        if [ -z "$BUNDLE" ]; then
          echo "::warning::No xcresult found — skipping coverage summary"
          {
            echo "## Coverage Summary"
            echo ""
            echo "_No unit-test result bundle available._"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        echo "Reading coverage from $BUNDLE"
        # The target line is `Pulse.app  46.56% (20011/42975)`, so $NF is the
        # ratio, not the percentage — the old awk yielded "(20011/42975)", which
        # the ratchet rejects as non-numeric (exit 2, a blocking failure). Anchor
        # to the target row and take the percentage field explicitly.
        COVERAGE=$(xcrun xccov view --report "$BUNDLE" 2>/dev/null \
          | grep -E '^Pulse\.app ' | grep -oE '[0-9]+\.[0-9]+%' | head -1 | tr -d '%')
        # A failed parse (renamed target, changed xccov output) must not reach the
        # ratchet as a number. "0" is fine for the human-readable table, but the
        # gate has to see "none" and take its skip path — otherwise a scraping bug
        # either blocks the PR as a fake 100pt regression, or, if master's baseline
        # was recorded the same way, silently disables the gate at 0 >= 0 - 1.
        if [ -z "$COVERAGE" ]; then
          echo "::warning::Could not parse coverage from xccov — ratchet will skip"
          COVERAGE="0"
          RATCHET_INPUT="none"
        else
          RATCHET_INPUT="$COVERAGE"
        fi
        echo "App-target coverage: ${COVERAGE}%"
        echo "RATCHET_INPUT=${RATCHET_INPUT}" >> "$GITHUB_ENV"
        # Published as an artifact so the next PR can ratchet against it. Skipped
        # on a failed parse for the same reason: a "0" baseline poisons every
        # later comparison, and no baseline is safer than a wrong one.
        if [ "$RATCHET_INPUT" != "none" ]; then
          mkdir -p coverage-value
          echo "${COVERAGE}" > coverage-value/coverage.txt
        fi
        bash scripts/generate-coverage-badge.sh "$BUNDLE" || true
        {
          echo "## Coverage Summary"
          echo ""
          echo "| Target | Line coverage |"
          echo "|--------|---------------|"
          echo "| Pulse.app | ${COVERAGE}% |"
          echo ""
          echo "_Overall app-target coverage. Per-PR changed-line coverage is gated"
          echo "separately by the Patch Coverage job (75% floor)._"
        } >> "$GITHUB_STEP_SUMMARY"

    # Baseline = overall coverage from the most recent successful master run.
    # Pulled from that run's artifact rather than committed to the repo: no
    # write permission, no bot commit on every merge, and nothing to conflict.
    # Missing baseline is not a failure — see the script's `none` handling.
    - name: Fetch master coverage baseline
      if: github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        BASELINE="none"
        # Walk back a few runs: the newest master run may predate this artifact,
        # or have skipped unit tests via the path filter.
        for RUN_ID in $(gh run list --workflow=ci.yml --branch=master \
              --status=success --event=push --limit=10 \
              --json databaseId --jq '.[].databaseId'); do
          if gh run download "$RUN_ID" --name coverage-value --dir baseline 2>/dev/null; then
            BASELINE=$(tr -d '[:space:]' < baseline/coverage.txt)
            echo "Baseline from master run $RUN_ID: ${BASELINE}%"
            break
          fi
        done
        [ -z "$BASELINE" ] && BASELINE="none"
        echo "BASELINE=${BASELINE}" >> "$GITHUB_ENV"

    - name: Enforce coverage ratchet
      if: github.event_name == 'pull_request'
      run: |
        python3 scripts/check-coverage-ratchet.py "${RATCHET_INPUT:-none}" "${BASELINE:-none}"

    # Uploaded on master too — that upload is what becomes the next baseline.
    - name: Upload coverage value
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: coverage-value
        path: coverage-value/coverage.txt
        retention-days: 90
        if-no-files-found: ignore

    - name: Upload coverage badge
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: coverage-badge
        path: badges/coverage.svg
        if-no-files-found: ignore

  # Aggregates the per-suite flake reports into one sticky PR comment. Pure
  # JSON/text merging, so it runs on ubuntu. Never fails the build: a flake is
  # a triage signal, not a broken build — the suites it summarizes all passed.
  flaky-report:
    name: Flaky Test Report
    runs-on: ubuntu-latest
    needs: [unit-tests, snapshot-tests, ui-tests, ui-tests-ipad]
    if: always() && github.event_name == 'pull_request'
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Harden runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Each suite uploads its own flaky-*.json; a skipped or failed suite simply
    # contributes nothing. `pattern` + `merge-multiple` collapses them into one
    # directory for the renderer to walk.
    - name: Download flaky reports
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      continue-on-error: true
      with:
        pattern: flaky-*
        merge-multiple: true
        path: flaky-reports

    - name: Render flaky report
      id: render
      env:
        FLAKY_DIR: flaky-reports
        OUTPUT: flaky-report.md
      run: python3 scripts/render-flaky-report.py

    # Posted when flakes exist, and actively DELETED when they don't — so a PR
    # that fixes the last flaky test loses the warning comment instead of
    # carrying a stale one forever.
    - name: Post flaky report as PR comment
      if: steps.render.outputs.has_flakes == 'true'
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        header: flaky-report
        path: flaky-report.md

    - name: Remove stale flaky report comment
      if: steps.render.outputs.has_flakes == 'false'
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        header: flaky-report
        delete: true
